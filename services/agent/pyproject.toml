[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aura-agent"
version = "0.1.0"
description = "AURA deterministic and self-hosted LLM planning service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
aura-agent = "aura_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_agent"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "../.."
venv = ".venv"
extraPaths = ["src"]
reportUnusedFunction = false
